name: Refresh GitHub Profile Metrics

on:
  workflow_dispatch:
  schedule:
    # Refresh six times a day. GitHub Actions schedules use UTC.
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
      - master
    paths:
      - "README.md"
      - "scripts/update_profile_metrics.py"
      - ".github/workflows/profile-metrics.yml"

permissions:
  contents: write

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate GitHub metrics and contribution heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: talebulislam
        run: python scripts/update_profile_metrics.py

      - name: Commit refreshed SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-dashboard.svg assets/contribution-heatmap.svg
          if git diff --cached --quiet; then
            echo "Profile metrics are unchanged."
          else
            git commit -m "chore: refresh GitHub profile metrics"
            git push
          fi
